name: Publish registries

# Retry crates.io / npm for an already-tagged release without rebuilding
# GitHub Release assets. Tokens must be real (cio_… / npm_…), not stubs.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Already-tagged version without the v prefix
        required: true
        default: "0.3.6"

jobs:
  publish-crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v${{ inputs.version }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "CARGO_REGISTRY_TOKEN not set"
            exit 1
          fi
          if curl -fsS -A "nimvault-mcp-release" \
            "https://crates.io/api/v1/crates/nimvault-mcp/$VERSION" >/dev/null; then
            echo "Version $VERSION already on crates.io, skipping"
            exit 0
          fi
          cargo publish --allow-dirty

  npm-publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v${{ inputs.version }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Publish
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN not set — trying provenance OIDC"
            npm publish --access public --provenance
            exit 0
          fi
          npm publish --access public
